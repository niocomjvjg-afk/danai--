<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DanAi Profile</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: var(--tg-theme-bg-color, #18222d);
            --card: var(--tg-theme-secondary-bg-color, #232e3c);
            --text: var(--tg-theme-text-color, #ffffff);
            --muted: var(--tg-theme-hint-color, #8a96a3);
            --accent: var(--tg-theme-button-color, #2ea6ff);
            --accent-text: var(--tg-theme-button-text-color, #ffffff);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; padding: 12px; padding-bottom: 80px; display: flex; flex-direction: column; gap: 12px; }
        .card { background: var(--card); border-radius: 14px; padding: 16px; }
        .header { display: flex; align-items: center; gap: 12px; }
        .avatar { width: 56px; height: 56px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; overflow: hidden; }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .name { font-size: 18px; font-weight: 600; }
        .title-badge { font-size: 12px; color: #fff; background: #ff0055; padding: 2px 8px; border-radius: 10px; display: inline-block; margin-top: 4px; }
        .coins { font-size: 14px; font-weight: bold; color: #ffaa00; background: rgba(255,170,0,0.1); padding: 6px 10px; border-radius: 8px; margin-left: auto; }
        .stat-row { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 8px; }
        .bar { height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; }
        .fill { height: 100%; background: var(--accent); width: 0%; transition: 0.3s; }
        .btn { width: 100%; background: var(--accent); color: var(--accent-text); border: none; padding: 14px; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 10px; }
        .btn:active { opacity: 0.8; }
        .fact { font-size: 14px; color: var(--muted); margin-top: 6px; }
    </style>
</head>
<body>
    <div class="card header">
        <div class="avatar" id="ava"><span id="ava-txt">U</span></div>
        <div>
            <div class="name" id="u-name">Загрузка...</div>
            <div class="title-badge" id="u-title">Новичок</div>
        </div>
        <div class="coins" id="u-coins">🪙 0</div>
    </div>

    <div class="card">
        <div class="stat-row">
            <span id="u-lvl">Уровень 1</span>
            <span id="u-xp" style="color: var(--muted);">0 / 100</span>
        </div>
        <div class="bar"><div class="fill" id="u-bar"></div></div>
    </div>

    <div class="card">
        <div style="font-weight: bold; margin-bottom: 10px;">🧠 Что бот знает о тебе</div>
        <div class="fact" id="u-facts">Пока ничего...</div>
    </div>

    <div class="card">
        <div style="font-weight: bold; margin-bottom: 10px;">🛒 Магазин</div>
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <div>
                <div>Размут на 1 минуту</div>
                <div style="font-size: 12px; color: var(--muted);">Снять ограничения</div>
            </div>
            <button class="btn" style="width: auto; padding: 10px 15px; margin: 0;" onclick="buy()">50 🪙</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.expand(); tg.ready(); }

        // 1. Пытаемся получить данные из ссылки (если открыли через /app)
        const p = new URLSearchParams(window.location.search);
        let coins = p.get('coins');
        let lvl = p.get('lvl');
        let xp = p.get('xp');
        let facts = p.get('facts');
        let title = p.get('title');

        // 2. Если в ссылке пусто, берем из памяти телефона
        if (!coins) {
            coins = localStorage.getItem('danai_coins') || 0;
            lvl = localStorage.getItem('danai_lvl') || 1;
            xp = localStorage.getItem('danai_xp') || 0;
            facts = localStorage.getItem('danai_facts') || "Пока ничего...";
            title = localStorage.getItem('danai_title') || "Новичок";
        } else {
            // Если данные пришли из ссылки, сохраняем их в память
            localStorage.setItem('danai_coins', coins);
            localStorage.setItem('danai_lvl', lvl);
            localStorage.setItem('danai_xp', xp);
            localStorage.setItem('danai_facts', facts);
            localStorage.setItem('danai_title', title);
        }

        // 3. Отрисовываем интерфейс
        document.getElementById('u-coins').innerText = "🪙 " + coins;
        document.getElementById('u-lvl').innerText = "Уровень " + lvl;
        document.getElementById('u-xp').innerText = xp + " / 100";
        document.getElementById('u-bar').style.width = xp + "%";
        document.getElementById('u-facts').innerText = decodeURIComponent(facts);
        document.getElementById('u-title').innerText = decodeURIComponent(title);

        if (tg?.initDataUnsafe?.user) {
            const u = tg.initDataUnsafe.user;
            const name = ((u.first_name || '') + ' ' + (u.last_name || '')).trim();
            if (name) document.getElementById('u-name').innerText = name;
            if (u.photo_url) document.getElementById('ava').innerHTML = `<img src="${u.photo_url}">`;
            else if (name) document.getElementById('ava-txt').innerText = name.charAt(0).toUpperCase();
        }

        function buy() {
            if (tg) {
                tg.HapticFeedback.notificationOccurred('success');
                tg.sendData(JSON.stringify({ action: "buy_unmute" }));
            } else {
                alert("Это работает только в Telegram!");
            }
        }
    </script>
</body>
</html>
